# yeschoy.app — open-source desktop landing (static). Do not proxy to new-api.

# HTTP: www -> apex, then HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.yeschoy.app;
    return 301 https://yeschoy.app$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name yeschoy.app;
    return 301 https://yeschoy.app$request_uri;
}

# HTTPS www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.yeschoy.app;

    ssl_certificate     /etc/letsencrypt/live/yeschoy.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeschoy.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://yeschoy.app$request_uri;
}

# HTTPS apex — static site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yeschoy.app;

    ssl_certificate     /etc/letsencrypt/live/yeschoy.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeschoy.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/yeschoy-app;
    index index.html;

    access_log /var/log/nginx/yeschoy_app_access.log;
    error_log  /var/log/nginx/yeschoy_app_error.log warn;

    # Prefer directory index for /download/ and /desktop/connect/
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /desktop/connect {
        return 301 /desktop/connect/;
    }

    location = /download {
        return 301 /download/;
    }

    # /dl/windows、/dl/mac 跳到最新安装包；由 refresh-release.py 生成
    include /etc/nginx/snippets/yeschoy-app-dl.conf;

    location = /api/latest {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files /api/latest.json =502;
    }

    location ~* \.(webp|png|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # No caching of HTML; allow short cache for static assets
    location ~* \.(css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }
}
