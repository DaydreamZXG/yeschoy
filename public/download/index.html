<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#06123a" />
  <link rel="icon" href="/site/logo.png" />
  <title>下载 YesChoy</title>
  <link rel="stylesheet" href="/site/landing.css" />
  <style>
    main { padding: 24px 0 0; }
    .dl-hero { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
    .dl-hero img { width: 88px; height: 132px; object-fit: cover; border-radius: 16px; }
    .dl-hero h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: -0.02em; }
    .dl-hero p { margin: 0; color: var(--dim); }

</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <header class="top wrap">
    <a class="brand" href="/">
      <img src="/site/logo.png" alt="" width="32" height="32" />
      <span>YesChoy</span>
    </a>
  </header>
  <main class="wrap" id="download">
    <div class="dl-hero">
      <img src="/site/roster/ds.webp" alt="" />

        <h1>下载 YesChoy</h1>
        <p>吃饱喝足，这就开工！—— 小鲸</p>
      </div>
    </div>
    <p class="sub" data-release-line>从 GitHub 下载最新正式版。</p>
    <div class="downloads">
      <a class="dl-card" href="/dl/windows" data-dl="windows">
        <strong>Windows</strong>
        <span>Windows 10 / 11，64 位</span>
        <em data-size="windows">安装程序 .exe</em>
      </a>
      <a class="dl-card" href="/dl/mac" data-dl="mac">
        <strong>macOS</strong>
        <span>Apple 芯片和 Intel 通用</span>
        <em data-size="mac">安装包 .dmg</em>
      </a>
    </div>
    <p class="links">
      <a href="https://github.com/DaydreamZXG/yeschoy/releases" rel="noopener">全部版本和更新说明</a>
      <a href="/">认识 YesChoy 的同学们</a>

  </main>
  <script src="/site/landing.js" defer></script>
</body>
</html>
